name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
        env:
          # Domain only — the /docus/ path comes from app.baseURL
          NUXT_SITE_URL: https://weltkugl.net

      - name: Backup current site on server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              "$SSH_USERNAME@$SSH_HOST" \
              "set -e
               if [ -d '${DEPLOY_PATH}/.output' ]; then
                 mkdir -p '${DEPLOY_PATH}/backups'
                 ts=\$(date +%Y%m%d-%H%M%S)
                 tar czf '${DEPLOY_PATH}/backups/backup-\$ts.tar.gz' -C '${DEPLOY_PATH}' .output
                 echo \"Backup created: backups/backup-\$ts.tar.gz\"
                 ls -1t '${DEPLOY_PATH}/backups' | tail -n +6 | xargs -r rm -f
               else
                 echo 'No existing .output to back up (first deploy) — skipping.'
               fi"

      - name: Deploy to Netcup server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Stream .output/ (Linux-x64 build incl. node_modules) via tar over
          # SSH — no rsync needed on the server. The server clears the previous
          # .output first so stale chunks from old builds can't linger.
          tar czf - -C .output . \
            | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
                "$SSH_USERNAME@$SSH_HOST" \
                "rm -rf '${DEPLOY_PATH}/.output' && mkdir -p '${DEPLOY_PATH}/.output' && tar xzf - -C '${DEPLOY_PATH}/.output' --strip-components=1"

          # Version the pm2 app definition with the repo
          tar czf - -C . ecosystem.config.cjs \
            | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
                "$SSH_USERNAME@$SSH_HOST" \
                "tar xzf - -C '${DEPLOY_PATH}'"

      - name: Restart app on server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              "$SSH_USERNAME@$SSH_HOST" \
              "set -e
               # Non-interactive SSH doesn't load shell profiles, so the npm
               # bin dir (where pm2 lives) may be missing from PATH. Load it.
               if [ -f \"\$HOME/.profile\" ]; then . \"\$HOME/.profile\"; fi
               if [ -f \"\$HOME/.bashrc\" ]; then . \"\$HOME/.bashrc\"; fi
               PM2=\"\$(command -v pm2 || true)\"
               if [ -z \"\$PM2\" ]; then
                 # Local install inside the app (npm i pm2, no -g)
                 if [ -x '${DEPLOY_PATH}/node_modules/.bin/pm2' ]; then
                   PM2='${DEPLOY_PATH}/node_modules/.bin/pm2'
                 else
                   # Fall back to the npm global bin
                   NPMBIN=\"\$(npm config get prefix 2>/dev/null)/bin\"
                   PM2=\"\$NPMBIN/pm2\"
                 fi
               fi
               echo \"Using pm2: \$PM2\"
               if \"\$PM2\" describe docus-wiki >/dev/null 2>&1; then
                 \"\$PM2\" restart docus-wiki --update-env
               else
                 \"\$PM2\" start ecosystem.config.cjs --only docus-wiki
                 \"\$PM2\" save
               fi"
